[project]
name = "spendiq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhishek kumar maurya", email = "akm.nitt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.141.1",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "openai>=2.53.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
spendiq = "spendiq:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
